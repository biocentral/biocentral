# CI-specific Docker Compose
# Extends the base docker-compose.yml with CI-specific overrides

services:
  embeddings-db:
    extends:
      file: docker-compose.yml
      service: embeddings-db
    ports:
      - "${POSTGRES_PORT}:5432"

  redis-jobs:
    extends:
      file: docker-compose.yml
      service: redis-jobs
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_JOBS_PORT}:6379"

  triton-model-init:  # Necessary to download local onnx files
    extends:
      file: docker-compose.yml
      service: triton-model-init
