x-app-defaults: &app-defaults
  security_opt:
    - no-new-privileges:true
  networks:
    - biocentral-network
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  environment: &app-env
    POSTGRES_HOST: embeddings-db
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    REDIS_JOBS_HOST: redis-jobs
    HF_HOME: /app/huggingface_models
    FILES_DATA_DIR: /app/storage/files
    ASSETS_DIR: /app/assets
    MODEL_REPOSITORY_PATH: /app/models
    MAX_FILE_SIZE: ${MAX_FILE_SIZE}

services:
  biocentral-server:
    <<: *app-defaults
    image: ghcr.io/biocentral/biocentral/biocentral-server:latest
    ports:
      - "${SERVER_PORT:-9540}:9540"
    volumes:
      - huggingface_models_cache:/app/huggingface_models
      - assets_data:/app/assets:ro
      - file_storage:/app/storage/files
      - local_models:/app/models:ro
    depends_on:
      biocentral-worker: { condition: service_started }
      redis-jobs: { condition: service_healthy }
      embeddings-db: { condition: service_healthy }
      biocentral-server-setup: { condition: service_completed_successfully }
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9540/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  biocentral-worker:
    <<: *app-defaults
    image: ghcr.io/biocentral/biocentral/biocentral-server:latest
    command: python3 worker.py
    volumes:
      - huggingface_models_cache:/app/huggingface_models
      - file_storage:/app/storage/files
      - assets_data:/app/assets
      - local_models:/app/models:ro
    restart: always
    depends_on:
      redis-jobs: { condition: service_healthy }
      embeddings-db: { condition: service_healthy }
      biocentral-server-setup: { condition: service_completed_successfully }

  redis-jobs:
    image: redis:alpine
    security_opt:
      - no-new-privileges:true
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - biocentral-network

  embeddings-db:
    image: postgres:15
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - biocentral-network

  biocentral-server-setup:
    security_opt:
      - no-new-privileges:true
    build:
      context: ./storage/model-repository
      dockerfile: Dockerfile.init
    volumes:
      - local_models:/app/models
    environment:
      - MODEL_REPOSITORY_PATH=/app/models
      - MODEL_DOWNLOADS=${MODEL_DOWNLOADS:-}
    networks:
      - biocentral-network

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${EMBEDDINGS_DATA_DIR}
  file_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${FILES_DATA_DIR:-./storage/files}
  temp_server_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SERVER_TEMP_DATA_DIR}
  huggingface_models_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HUGGINGFACE_MODELS_DIR}
  local_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODEL_REPOSITORY_PATH:-./storage/model-repository}
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REDIS_DATA_DIR:-./storage/redis}
  assets_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ASSETS_DIR:-./assets}

networks:
  biocentral-network:
    driver: bridge
