services:
  # Run via docker compose --profile app up --build --pull never
  biocentral-server:
    profiles: ["app"]  # Only runs this service with the app profile (for local debug of the docker container)
    build: .
    ports:
      - "9540:9540"
    volumes:
      - .:/app
    environment:
      - SERVER_DEBUG=True

  embeddings-db:
    ports:
      - "${POSTGRES_PORT}:5432"

  redis-jobs:
    ports:
      - "${REDIS_JOBS_PORT}:6379"

  biocentral-worker:
    profiles: ["app"]
    build: .

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis-jobs:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis-jobs
    networks:
      - biocentral-network
    restart: unless-stopped

  triton:
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    command: > # Some models are excluded for local development: --load-model=prot_t5_pipeline --load-model=esm2_t36_pipeline
      tritonserver
      --model-repository=/app/models
      --model-control-mode=explicit
      --load-model=esm2_t33_pipeline
      --load-model=prott5_sec
      --load-model=prott5_cons
      --load-model=bind_embed
      --load-model=seth
      --load-model=tmbed
      --load-model=light_attention_subcell
      --load-model=light_attention_membrane
      --load-model=vespag
      --load-model=exotox
      --load-model=udonpred
      --disable-auto-complete-config
      --log-verbose=1

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DOZZLE_NO_ANALYTICS=true
    networks:
      - biocentral-network
