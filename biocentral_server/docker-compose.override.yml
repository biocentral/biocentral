services:
  # Run via docker compose --profile app up --build --pull never
  biocentral-server:
    profiles: ["app"]  # Only runs this service with the app profile (for local debug of the docker container)
    build: .
    ports:
      - "9540:9540"
    volumes:
      - .:/app
    environment:
      - SERVER_DEBUG=True

  embeddings-db:
    ports:
      - "${POSTGRES_PORT}:5432"

  redis-jobs:
    ports:
      - "${REDIS_JOBS_PORT}:6379"

  biocentral-worker:
    profiles: ["app"]
    build: .

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis-jobs:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis-jobs
    networks:
      - biocentral-network
    restart: unless-stopped
