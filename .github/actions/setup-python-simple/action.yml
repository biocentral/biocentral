name: "Setup Simple Python Environment"
description: "Checkout, set up Python 3.12, install uv, and install dependencies for a Python subproject"

inputs:
  working-directory:
    description: "Working directory for dependency installation"
    required: true
  extras:
    description: "Install all extras if set to true"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - uses: astral-sh/setup-uv@v10.4.0
      with:
        version: '0.13.9'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --no-sources --no-install-project ${{ inputs.extras == 'true' && '--all-extras' || '' }} --index-strategy unsafe-best-match --exclude-newer false
      env:
        UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu