name: "Setup Flutter IRE Environment"
description: "Install Linux dependencies, set up Flutter, get dependencies, and build the companion app for biocentral_ire"

runs:
  using: "composite"
  steps:
    - name: Install Linux Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang libgtk-3-dev

    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: biocentral_ire/pubspec.yaml

    - name: Get Flutter dependencies
      shell: bash
      working-directory: biocentral_ire
      run: flutter pub get

    - name: Build companion app
      shell: bash
      working-directory: biocentral_ire
      run: dart run serious_python:main package --asset assets/python_companion.zip python_companion/ -p Linux -r -r -r python_companion/requirements.txt
      env:
        SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/biocentral_ire/build/site-packages
