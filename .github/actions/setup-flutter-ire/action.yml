name: "Setup Flutter IRE Environment"
description: "Install Linux dependencies, set up Flutter, get dependencies, and build the companion app for biocentral_ire"

runs:
  using: "composite"
  steps:
    - name: Install Linux Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang libgtk-3-dev

    - uses: subosito/flutter-action@v2
      with:
        channel: master
        flutter-version: cf97bfbcb9f508a35cfdc451f4c2d19e30ad6b7c
        cache: true

    - name: Get Flutter dependencies
      shell: bash
      working-directory: biocentral_ire
      run: flutter pub get

    - name: Build companion app
      shell: bash
      working-directory: biocentral_ire
      run: dart run serious_python:main package python_companion/ -p Linux -r -r -r python_companion/requirements.txt
      env:
        SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/biocentral_ire/build/site-packages
