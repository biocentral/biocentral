[project]
name = "biocentral-monorepo"
version = "2.0.0"
description = "Monorepo for Biocentral projects"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pre-commit>=4.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[tool.uv]
exclude-newer = "7 days"  # Minimum release age of pypi packages: 7 days

[project.optional-dependencies]
generate = [
    "openapi-generator-cli>=7.24.0",
    "biocentral-server>=2.0.0,<3.0.0"
]

[tool.uv.sources]
biocentral-server = { path = "biocentral_server/", editable = true }