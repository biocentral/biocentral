[project]
name = "biocentral_api"
version = "2.0.0"
description = "Programmatic access to the biocentral ecosystem."
authors = [
    { name = "Sebastian Franz", email = "sebastian.franz@tum.de" },
]
readme = "README.md"
keywords = ["OpenAPI", "OpenAPI-Generator", "Biocentral Server", "Biocentral"]
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}

dependencies = [
    "urllib3>=2.1.0,<3.0.0",
    "python-dateutil>=4.0.0,<5.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "typing-extensions>=4.7.1,<5.0.0",
    "tqdm>=4.68.0,<5.0.0",
    "biotrainer-core>=2.0.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/biocentral/biocentral/"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "tox>=4.60.0,<5.0.0",
    "flake8>=7.5.0,<8.0.0",
    "types-python-dateutil>=2.9.0,<3.0.0",
    "mypy>=2.0.0,<3.0.0",
    "build>=1.6.0,<2.0.0",
    "twine>=7.0.0,<8.0.0",
]

[tool.uv]
exclude-newer = "7 days"  # Minimum release age of pypi packages: 7 days

[tool.uv.sources]
biotrainer-core = { path = "../../biotrainer/biotrainer-core", editable = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"

[tool.mypy]
files = [
    "biocentral_api._generated",
    #"test",  # auto-generated tests
    "tests", # hand-written tests
]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = [
    "biocentral_server._generated.configuration",
]
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
