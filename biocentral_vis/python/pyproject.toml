[project]
name = "biocentral-vis"
version = "2.0.0"
description = "Cross-Platform Visualizations for the Biocentral Ecosystem"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "altair>=6.0.0",
    "vl-convert-python>=1.9.0.post1",
    "biocentral-api>=2.0.0,<3.0.0",
]

[tool.uv]
exclude-newer = "7 days"  # Minimum release age of pypi packages: 7 days

[tool.uv.sources]
biocentral_api = { path = "../../biocentral_api/python", editable = true }
