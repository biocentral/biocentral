# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-executables-have-shebangs
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix ]
        exclude: ^biocentral_api/python/biocentral_api/_generated/
      - id: ruff-format
        exclude: ^biocentral_api/python/biocentral_api/_generated/

  - repo: local
    hooks:
      # Declared locally rather than via pre-commit/mirrors-prettier: pre-commit installs
      # a hook repo that ships a package.json as `git+file://...`, which npm >=11 refuses
      # (EALLOWGIT). additional_dependencies takes the plain-package path instead.
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: ["prettier@4.0.0-alpha.8"]
        types_or: [javascript, jsx, ts, tsx, css, scss, html, json, markdown]
        # Exclude generated docs to not generate gigantic diff
        exclude: |
          (?x)^(
            biocentral_api/openapi_spec/|
            biocentral_api/python/docs/_generated/|
            biocentral_api/dart/doc/_generated/
          )
      - id: dart-format
        name: Dart Format
        entry: dart format
        language: system
        types: [dart]
      - id: dart-analyze
        name: Dart Analyze
        entry: dart analyze
        language: system
        types: [dart]
        description: "Note: dart analyze might need to be run from package roots if dependencies are not globally available."
      - id: check-commit-msg
        name: Check Commit Message Format
        entry: _global/bin/check_commit_msg.py
        language: python
        stages: [commit-msg]
